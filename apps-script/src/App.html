<script>
// ───────────── Ядро ─────────────
var S = { token: '', route: 'home', params: {}, me: null, flash: null };
try { S.token = localStorage.getItem('umed_token') || ''; } catch (e) {}

function saveToken(t) { S.token = t || ''; try { if (t) localStorage.setItem('umed_token', t); else localStorage.removeItem('umed_token'); } catch (e) {} }

function e(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function $(id) { return document.getElementById(id); }

function call(kind, name, payload) {
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (s) { resolve(JSON.parse(s)); })
      .withFailureHandler(function (err) { reject(err); })
      .api(S.token, kind, name, payload || {});
  });
}

function loading(on) { $('loading').style.display = on ? 'block' : 'none'; }

function toast(msg, kind) {
  $('toast').innerHTML = msg ? '<div class="alert toast ' + (kind || 'ok') + '">' + e(msg) + '</div>' : '';
  if (msg) setTimeout(function () { if ($('toast').textContent === msg) $('toast').innerHTML = ''; }, kind === 'error' ? 7000 : 4000);
}

function parseLink(link) {
  var parts = String(link || '').replace(/^#/, '').split('?');
  var path = parts[0].split('/');
  var params = {};
  if (parts[1]) parts[1].split('&').forEach(function (kv) { var p = kv.split('='); params[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ''); });
  if (path[1]) params.id = path[1];
  return { route: path[0] || 'home', params: params };
}

function linkOf(route, params) {
  var p = Object.assign({}, params || {});
  var id = p.id; delete p.id;
  var q = Object.keys(p).filter(function (k) { return p[k] !== '' && p[k] != null; }).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(p[k]); }).join('&');
  return route + (id ? '/' + id : '') + (q ? '?' + q : '');
}

var ROUTE_VIEW = { home: 'home', schedule: 'schedule', groups: 'groups', group: 'group', student: 'student', feedback: 'feedback',
  'feedback-new': 'feedbackNew', movements: 'movements', staff: 'staff', reports: 'reports', me: 'me' };

function go(link, push) {
  var r = typeof link === 'string' ? parseLink(link) : link;
  S.route = ROUTE_VIEW[r.route] ? r.route : 'home';
  S.params = r.params || {};
  if (push !== false) { try { google.script.history.push({ l: linkOf(S.route, S.params) }, null, linkOf(S.route, S.params)); } catch (x) {} }
  return load();
}

function load() {
  if (!S.token) return renderLogin();
  loading(true);
  return call('view', ROUTE_VIEW[S.route], S.params).then(function (r) {
    loading(false);
    if (r.auth === false) { saveToken(''); return renderLogin(); }
    if (r.error) { $('app').innerHTML = '<div class="alert error">' + e(r.error) + '</div><p><a data-link="home">На главную</a></p>'; return; }
    S.me = r.me;
    renderTop();
    $('app').innerHTML = (PAGES[S.route] || PAGES.home)(r.data);
    window.scrollTo(0, 0);
  }).catch(function (err) {
    loading(false);
    $('app').innerHTML = '<div class="alert error">Не удалось загрузить: ' + e(err && err.message || err) + '</div>';
  });
}

function formData(form) {
  var o = {};
  new FormData(form).forEach(function (v, k) {
    if (o[k] === undefined) o[k] = v;
    else if (Array.isArray(o[k])) o[k].push(v);
    else o[k] = [o[k], v];
  });
  return o;
}

document.addEventListener('click', function (ev) {
  var a = ev.target.closest('[data-link]');
  if (a) { ev.preventDefault(); go(a.getAttribute('data-link')); }
  if (ev.target.closest('[data-logout]')) { ev.preventDefault(); saveToken(''); renderLogin(); }
});

document.addEventListener('submit', function (ev) {
  var f = ev.target;
  ev.preventDefault();
  if (f.hasAttribute('data-nav')) {
    var p = formData(f);
    var base = parseLink(f.getAttribute('data-nav'));
    return go({ route: base.route, params: Object.assign(base.params, p) });
  }
  if (f.hasAttribute('data-login')) {
    var d = formData(f);
    loading(true);
    return call('login', '', d).then(function (r) {
      loading(false);
      if (r.error) { $('login-err').innerHTML = '<div class="alert error">' + e(r.error) + '</div>'; return; }
      saveToken(r.data.token); go('home');
    }).catch(function (err) { loading(false); $('login-err').innerHTML = '<div class="alert error">' + e(err.message || err) + '</div>'; });
  }
  var act = f.getAttribute('data-act');
  if (!act) return;
  if (f.hasAttribute('data-confirm') && !confirm(f.getAttribute('data-confirm'))) return;
  var buttons = f.querySelectorAll('button');
  buttons.forEach(function (b) { b.disabled = true; });
  loading(true);
  call('act', act, formData(f)).then(function (r) {
    loading(false);
    buttons.forEach(function (b) { b.disabled = false; });
    if (r.auth === false) { saveToken(''); return renderLogin(); }
    if (r.error) return toast(r.error, 'error');
    var d = r.data || {};
    var after = d.redirect ? go(d.redirect) : load();
    after.then(function () {
      if (d.open && $(d.open)) { $(d.open).open = true; var inp = $(d.open).querySelector('input:not([type=hidden])'); if (inp) inp.focus(); }
      if (d.msg && d.keep) $('app').insertAdjacentHTML('afterbegin', '<div class="alert ok">' + e(d.msg) + '</div>');
      else if (d.msg) toast(d.msg);
    });
  }).catch(function (err) {
    loading(false);
    buttons.forEach(function (b) { b.disabled = false; });
    toast('Ошибка связи: ' + (err && err.message || err), 'error');
  });
});

// ───────────── Общие элементы ─────────────
function L(link, text, cls) { return '<a data-link="' + e(link) + '"' + (cls ? ' class="' + cls + '"' : '') + '>' + text + '</a>'; }
function pill(text, cls) { return '<span class="pill ' + (cls || '') + '">' + e(text) + '</span>'; }
function hidden(n, v) { return '<input type="hidden" name="' + n + '" value="' + e(v) + '">'; }
function opt(v, label, sel, dis) { return '<option value="' + e(v) + '"' + (sel ? ' selected' : '') + (dis ? ' disabled' : '') + '>' + e(label) + '</option>'; }
function select(name, items, cur, empty, extra) {
  return '<select name="' + name + '"' + (extra || '') + '>' + (empty != null ? opt('', empty, !cur) : '') +
    items.map(function (i) { return opt(i[0], i[1], String(i[0]) === String(cur)); }).join('') + '</select>';
}
function barCls(p) { return p == null ? '' : p >= 85 ? 'good' : p < 70 ? 'bad' : 'mid'; }
function pctBlock(label, p, num, den) {
  return '<div>' + (label ? '<div class="small muted">' + e(label) + '</div>' : '') +
    '<div class="row"><b>' + (p == null ? '—' : p + '%') + '</b>' + (den ? '<span class="small muted">' + num + '/' + den + '</span>' : '') + '</div>' +
    '<div class="bar ' + barCls(p) + '"><span style="width:' + (p || 0) + '%"></span></div></div>';
}
function cardH(title, inner, extra) { return '<div class="card' + (extra ? ' ' + extra : '') + '"><h2 style="margin-top:0">' + title + '</h2>' + inner + '</div>'; }
function table(head, rows, empty, cols) {
  return '<div class="table-wrap"><table><thead><tr>' + head.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>' +
    (rows.length ? rows.join('') : '<tr><td colspan="' + (cols || head.length) + '" class="muted">' + (empty || 'Пусто') + '</td></tr>') + '</tbody></table></div>';
}
var DAYS = [['MWF', 'Пн-Ср-Пт'], ['TTS', 'Вт-Чт-Сб']];
var SLOTS = [['S15', '15:00–17:00'], ['S17', '17:00–19:00'], ['S19', '19:00–21:00']];
var DL = { MWF: 'Пн-Ср-Пт', TTS: 'Вт-Чт-Сб' }, SL = { S15: '15:00–17:00', S17: '17:00–19:00', S19: '19:00–21:00' };
var GSTATUS = { RECRUITING: ['набор', 'amber'], WAITING: ['ждёт старта', 'green'], ACTIVE: ['идёт', 'blue'], FINISHED: ['завершена', ''] };
var TONE = { POSITIVE: ['Позитив', 'green'], NEUTRAL: ['Нейтрально', ''], NEGATIVE: ['Негатив', 'red'] };
var FBST = { OPEN: 'Открыт', IN_PROGRESS: 'В работе', RESOLVED: 'Решено', UNSOLVABLE: 'Не решаемо' };

function renderTop() {
  var m = S.me;
  var nav = [['home', 'Главная' + (m.badge ? ' <span class="badge-count">' + m.badge + '</span>' : '')], ['schedule', 'Расписание'], ['groups', 'Группы'],
    ['feedback', 'Отзывы'], ['movements', 'Движения']];
  if (m.canReports) nav.push(['reports', 'Отчёты']);
  else if (m.user.department === 'TEACHER' || m.user.department === 'CURATOR') nav.push(['reports', 'Мои показатели']);
  if (m.showStaff) nav.push(['staff', 'Сотрудники']);
  $('top').style.display = '';
  $('top').innerHTML = '<div class="wrap"><a class="brand" data-link="home">UMED</a>' +
    nav.map(function (n) { return '<a data-link="' + n[0] + '" class="' + (S.route === n[0] ? 'active' : '') + '">' + n[1] + '</a>'; }).join('') +
    '<span class="me">' + e(m.user.name) + ' · ' + e(m.deptLabel) + ' <a data-link="me">Мой код</a> <button class="small secondary" data-logout>Выйти</button></span></div>';
}

function renderLogin() {
  $('top').style.display = 'none';
  $('app').innerHTML = '<div style="max-width:380px;margin:60px auto 0"><div class="card"><h1>UMED CRM</h1>' +
    '<p class="muted">Вход по логину и коду. Код выдаёт руководитель.</p><div id="login-err"></div>' +
    '<form data-login><div class="field"><label>Логин</label><input name="login" autocomplete="username" autocapitalize="none" required></div>' +
    '<div class="field"><label>Код</label><input name="code" type="password" autocomplete="current-password" required></div>' +
    '<button type="submit">Войти</button></form></div></div>';
  return Promise.resolve();
}

// ───────────── Страницы ─────────────
var PAGES = {};

PAGES.home = function (d) {
  var item = function (inner) { return '<div class="item">' + inner + '</div>'; };
  var ackBtn = function (rid, text, cls) { return '<form data-act="ack" style="margin-left:auto">' + hidden('recipientId', rid) + '<button class="small ' + (cls || '') + '" type="submit">' + text + '</button></form>'; };
  var doneBtn = function (t) { return t.manual ? '<form data-act="completeTask" style="margin-left:auto">' + hidden('taskId', t.id) + '<button class="small secondary" type="submit">Выполнено</button></form>' : ''; };
  var red = d.redNotes.length + d.overdue.length + d.risks.length + d.fbOverdue.length + d.unreviewed.length + d.lateAcks.length;
  var h = '<h1>Здравствуйте, ' + e(d.name) + '</h1>';
  var z = '';
  d.redNotes.forEach(function (n) {
    z += item('<div class="row">' + pill(n.kind === 'risk' ? 'риск' : 'важно', 'red') + ' ' + L(n.link || 'home', '<b>' + e(n.title) + '</b>') +
      ' <span class="muted small">' + e(n.created) + '</span>' + ackBtn(n.rid, 'Принято, понял(а)') + '</div>' +
      (n.body ? '<div class="muted small">' + e(n.body) + '</div>' : '') + (n.ackDue ? '<div class="small muted">Подтвердить до ' + e(n.ackDue) + '</div>' : ''));
  });
  d.overdue.forEach(function (t) {
    z += item('<div class="row">' + pill('просрочено', 'red') + ' ' + L(t.link || 'home', e(t.title)) + ' <span class="muted small">срок ' + e(t.due) + '</span>' + doneBtn(t) + '</div>' +
      (t.details ? '<div class="muted small">' + e(t.details) + '</div>' : ''));
  });
  d.lateAcks.forEach(function (n) { z += item(pill('не приняли за 24 ч', 'red') + ' ' + L(n.link || 'home', e(n.title)) + '<div class="small muted">Не подтвердили: ' + e(n.names) + '</div>'); });
  d.unreviewed.forEach(function (m) { z += item(pill('проверить уход/перевод', 'amber') + ' ' + L('movements', e(m.student)) + ' <span class="muted small">— отметьте, на кого влияет (куратор / преподаватель / бизнес)</span>'); });
  d.fbOverdue.forEach(function (f) { z += item(pill('отзыв: срок проверки прошёл', 'red') + ' ' + L('feedback?view=control', e(f.student)) + ' <span class="muted small">«' + e(f.text) + '» · срок ' + e(f.check) + '</span>'); });
  if (d.risks.length) z += '<h3>Ученики в риске (' + d.risks.length + ')</h3>';
  d.risks.forEach(function (r) { z += item(pill(r.source, 'red') + ' ' + L('student/' + r.studentId, e(r.student)) + ' <span class="muted small">' + e(r.group) + ' · ' + e(r.reason) + '</span>'); });
  h += '<div class="card ' + (red ? 'redzone' : '') + '"><h2>Красная зона ' + (red ? pill(red, 'red') : pill('всё в порядке', 'green')) + '</h2>' + z + '</div>';
  var tasks = d.open.map(function (t) {
    return item('<div class="row">' + L(t.link || 'home', e(t.title)) + ' <span class="muted small">до ' + e(t.due) + '</span>' + doneBtn(t) + '</div>' + (t.details ? '<div class="muted small">' + e(t.details) + '</div>' : ''));
  }).join('') || '<p class="muted">Открытых задач нет.</p>';
  var notes = d.notes.map(function (n) {
    return item('<div class="row">' + L(n.link || 'home', e(n.title)) + ' <span class="muted small">' + e(n.created) + '</span>' + ackBtn(n.rid, 'Принято', 'secondary') + '</div>' + (n.body ? '<div class="muted small">' + e(n.body) + '</div>' : ''));
  }).join('') || '<p class="muted">Новых уведомлений нет.</p>';
  h += '<div class="grid two"><div class="card"><h2 style="margin-top:0">Мои задачи (' + d.open.length + ')</h2>' + tasks + '</div>' +
    '<div class="card"><div class="row"><h2 style="margin-top:0">Уведомления (' + d.notes.length + ')</h2>' +
    (d.notes.length ? '<form data-act="ackAll" style="margin-left:auto"><button class="small secondary" type="submit">Принять все</button></form>' : '') + '</div>' + notes + '</div></div>';
  return h;
};

PAGES.schedule = function (d) {
  var h = '<h1>Расписание и свободные места</h1><p class="muted small">Синий — группа идёт, жёлтый — идёт набор, зелёный — набор закрыт, ждёт старта. Пустая ячейка — кабинет свободен' +
    (d.canOpen ? ': нажмите «Открыть набор».' : '.') + ' Редактируют расписание админы на странице группы.</p>';
  d.branches.forEach(function (b) {
    var head = '<tr><th></th>' + DAYS.map(function (dd) { return SLOTS.map(function (s) { return '<th>' + dd[1] + '<br>' + s[1] + '</th>'; }).join(''); }).join('') + '</tr>';
    var rows = (b.isOnline ? [null] : b.rooms).map(function (room) {
      return '<tr><th>' + e(room ? room.name : 'Онлайн') + '</th>' + DAYS.map(function (dd) {
        return SLOTS.map(function (s) {
          var gs = b.groups.filter(function (g) { return g.days === dd[0] && g.slot === s[0] && (b.isOnline || g.roomId === (room && room.id)); });
          var cls = gs.some(function (g) { return g.status === 'ACTIVE'; }) ? 'busy' : gs.some(function (g) { return g.status === 'RECRUITING'; }) ? 'recruit' : gs.length ? 'wait' : '';
          var inner = gs.map(function (g) {
            return '<div style="margin-bottom:6px">' + L('group/' + g.id, '<b>' + e(g.name) + '</b>') + '<div class="small muted">' + GSTATUS[g.status][0] + ' · ' + g.count +
              (b.isOnline ? '' : '/' + (room ? room.capacity : 22)) + ' уч. · старт ' + e(g.start) + '</div></div>';
          }).join('');
          if (d.canOpen && (b.isOnline || !gs.length)) {
            inner += '<details><summary class="small">Открыть набор</summary><form data-act="openRecruitment">' + hidden('branchId', b.id) + (room ? hidden('roomId', room.id) : '') +
              hidden('days', dd[0]) + hidden('slot', s[0]) + '<label>Дата старта (' + dd[1] + ')</label><input type="date" name="startDate" value="' + d.nextStart[dd[0]] + '" required>' +
              '<div style="margin-top:6px"><button class="small" type="submit">Открыть</button></div></form></details>';
          }
          if (!gs.length && !d.canOpen) inner = '<span class="muted small">свободно</span>';
          return '<td><div class="cell ' + cls + '">' + inner + '</div></td>';
        }).join('');
      }).join('') + '</tr>';
    }).join('');
    h += '<div class="card"><h2 style="margin-top:0">' + e(b.name) + '</h2><div class="table-wrap"><table class="chess"><thead>' + head + '</thead><tbody>' + rows + '</tbody></table></div></div>';
  });
  var srows = d.staff.map(function (u) {
    return '<tr><td>' + e(u.name) + ' <span class="muted small">' + u.dept + '</span></td>' + DAYS.map(function (dd) {
      return SLOTS.map(function (s) {
        var here = u.cells[dd[0] + '_' + s[0]] || [];
        return '<td class="small">' + (here.length ? here.map(function (g) { return '<div>' + L('group/' + g.id, e(g.name)) + '</div>'; }).join('') : pill('свободен', 'green')) + '</td>';
      }).join('');
    }).join('') + '</tr>';
  });
  var shead = ['Сотрудник'].concat([].concat.apply([], DAYS.map(function (dd) { return SLOTS.map(function (s) { return dd[1] + ' ' + s[1]; }); })));
  h += cardH('Занятость преподавателей и кураторов', table(shead, srows, 'Сотрудники ещё не добавлены.'));
  return h;
};

PAGES.groups = function (d) {
  var fin = d.finished ? '&status=finished' : '';
  var h = '<h1>Группы</h1><div class="row" style="margin-bottom:12px">' + L('groups?' + fin.slice(1), 'Все', 'btn ' + (d.branch ? 'secondary' : '')) +
    d.branches.map(function (b) { return L('groups?branch=' + b.id + fin, e(b.name), 'btn ' + (d.branch === b.id ? '' : 'secondary')); }).join('') +
    '<span style="margin-left:auto">' + L(d.finished ? 'groups' : 'groups?status=finished', d.finished ? 'Текущие' : 'Завершённые', 'btn secondary') + '</span></div>';
  var none = function (v) { return v ? e(v) : pill('нет', 'red'); };
  var rows = d.groups.map(function (g) {
    return '<tr><td>' + L('group/' + g.id, '<b>' + e(g.name) + '</b>') + (g.risks ? ' ' + pill('риск: ' + g.risks, 'red') : '') + '</td><td>' + e(g.branch) + '</td><td>' + e(g.schedule) +
      '</td><td>' + e(g.start) + '</td><td>' + g.count + (g.online ? '' : '/22') + '</td><td>' + none(g.chem) + '</td><td>' + none(g.bio) + '</td><td>' + none(g.curator) +
      '</td><td>' + pill(GSTATUS[g.status][0], GSTATUS[g.status][1]) + '</td></tr>';
  });
  return h + '<div class="card" style="padding:0">' + table(['Группа', 'Филиал', 'Расписание', 'Старт', 'Учеников', 'Химия', 'Биология', 'Куратор', 'Статус'], rows, 'Групп нет. Набор открывается в «Расписании».') + '</div>';
};

PAGES.group = function (g) {
  var GL = { RECRUITING: 'Идёт набор', WAITING: 'Набор закрыт, ждёт старта', ACTIVE: 'Группа идёт', FINISHED: 'Завершена' };
  var base = 'group/' + g.id;
  var h = '<div class="row"><h1 style="margin-bottom:4px">' + e(g.name) + '</h1>' + pill(GL[g.status], 'blue') + '</div>' +
    '<p class="muted" style="margin-top:0">' + e(g.branch) + (g.room ? ', ' + e(g.room) : '') + ' · ' + g.daysLabel + ' · ' + g.slotLabel + ' · старт ' + g.start + ' · ' + g.months +
    ' мес. · ' + Number(g.price).toLocaleString('ru-RU') + ' сом/мес' + (g.description ? '<br>' + e(g.description) : '') + '</p>';
  var tabs = [['overview', 'Состав'], ['attendance', 'Посещаемость'], ['homework', 'ДЗ'], ['touches', 'Касания'], ['survey', 'Опросник'], ['schedule', 'Занятия'], ['history', 'Движения']];
  h += '<div class="tabs">' + tabs.map(function (t) { return L(base + '?tab=' + t[0], t[1], g.tab === t[0] ? 'active' : ''); }).join('') + '</div>';
  var sel = g.sel;
  var picker = function (tab, onlyPast) {
    return '<div class="row" style="margin-bottom:10px">' + g.monthsList.map(function (m) {
      return '<span class="row" style="gap:4px"><span class="small muted">Мес. ' + m + ':</span>' + g.lessons.filter(function (l) { return l.month === m && (!onlyPast || l.past); }).map(function (l) {
        return '<a data-link="' + base + '?tab=' + tab + '&lesson=' + l.index + '" class="pill ' + (sel && l.id === sel.id ? 'blue' : l.past ? 'green' : '') + '" title="' + e(l.when + ' · ' + l.subject) + '">' + l.pos + '</a>';
      }).join('') + '</span>';
    }).join('') + '</div>';
  };
  var teacherOpts = g.teachers.map(function (t) { return [t.id, t.name]; });

  if (g.tab === 'overview') {
    h += '<div class="kpis" style="margin-bottom:14px"><div class="card"><div class="small muted">Учеников сейчас</div><div class="stat">' + g.activeCount + (g.online ? '' : '/22') + '</div></div>' +
      '<div class="card"><div class="small muted">На старте</div><div class="stat">' + (g.startCount == null ? '—' : g.startCount) + '</div></div>' +
      g.kpis.map(function (k) { return '<div class="card">' + pctBlock(k.label, k.p, k.num, k.den) + '</div>'; }).join('') + '</div>';
    var team = '<p>Химия: <b>' + e(g.chem || 'не назначен') + '</b><br>Биология: <b>' + e(g.bio || 'не назначен') + '</b><br>Куратор: <b>' + e(g.curator || 'не назначен') + '</b></p>';

      '<div class="field"><label>Как написал/сказал ученик — дословно</label><textarea name="reasonVerbatim"></textarea></div>' +
      '<div class="field"><label>Что сделал куратор (обязательно при уходе)</label><textarea name="curatorAction"></textarea></div>' +
      '<div class="field"><label>Комментарий</label><input name="comment"></div>' +
      '<p class="small muted">После сохранения все (админы, менеджеры, кураторы, руководство) получат красное уведомление — его нужно принять в течение 24 часов.</p>' +
      '<button class="danger" type="submit">Сохранить изменение</button></form></div>';
  }
  var AL = { PRESENT: ['был', 'green'], ABSENT: ['не был', 'red'], EXCUSED: ['отпросился', 'amber'] };
  var att = table(['№', 'Дата', 'Предмет', 'Отметка', 'Причина / тест'], s.attendance.map(function (a) {
    return '<tr><td>' + a.index + '</td><td>' + a.date + '</td><td>' + a.subject + '</td><td>' + (a.status ? pill(AL[a.status][0], AL[a.status][1]) : '—') + '</td><td class="small">' + e(a.info) + '</td></tr>';
  }));
  var cell = function (x) { return !x ? '—' : x.done ? pill('сдано' + (x.score != null ? ' ' + x.score + '/' + (x.max || '?') : ''), 'green') : '<span class="small">' + pill('не сдано', 'red') + ' ' + e(x.reason) + (x.expected ? ' · ждём ' + x.expected : '') + '</span>'; };
  var hw = table(['№', 'Опыт', 'Тест'], s.homework.map(function (x) { return '<tr><td>' + x.index + '</td><td>' + cell(x.exp) + '</td><td>' + cell(x.test) + '</td></tr>'; }));
  h += '<div class="grid two">' + cardH('Посещаемость', att) + cardH('ДЗ', hw) + '</div>';
  var touches = (s.parentsNotInvolved ? '<p>' + pill('родители не участвуют') + ' ' + e(s.parentsReason) + '</p>' : '') + (s.touches.map(function (t) {
    return '<div class="item"><b>Месяц ' + t.month + ', касание ' + t.number + '</b> · ' + t.date + ' ' + (t.awaiting ? pill('ожидается ответ', 'amber') : pill('ответ получен', 'green')) + (t.response ? '<div class="small">«' + e(t.response) + '»</div>' : '') + '</div>';
  }).join('') || '<p class="muted">Касаний пока нет.</p>');
  var fb = s.feedback.map(function (f) { return '<div class="item">' + pill(TONE[f.tone][0], TONE[f.tone][1]) + ' <span class="small muted">' + f.date + ' · ' + e(f.from) + ' · о: ' + e(f.about) + '</span><div class="small">«' + e(f.text) + '»</div></div>'; }).join('') || '<p class="muted">Отзывов нет.</p>';
  h += '<div class="grid two">' + cardH('Касания с родителями', touches) + '<div class="card"><div class="row"><h2 style="margin-top:0">Отзывы</h2><span style="margin-left:auto">' + L('feedback-new?student=' + s.id, '+ Отзыв', 'btn small') + '</span></div>' + fb + '</div></div>';
  var MT = { TRANSFER: 'перевод', LEAVE: 'уход', CHANGE: 'изменение', OTHER: 'другое' };
  h += cardH('История движений', s.movements.map(function (m) {
    return '<div class="item"><b>' + m.date + '</b> · ' + MT[m.type] + (m.type === 'TRANSFER' ? ': ' + e(m.from) + ' → ' + e(m.to) : '') + ' · ' + e(m.reason) + (m.verbatim ? ' · «' + e(m.verbatim) + '»' : '') +
      (m.action ? '<div class="small muted">Куратор: ' + e(m.action) + '</div>' : '') + (m.links ? '<div class="small"><a href="' + e(m.links) + '" target="_blank" rel="noreferrer">скриншоты</a></div>' : '') + '</div>';
  }).join('') || '<p class="muted">Не было.</p>');
  return h;
};

PAGES['feedback-new'] = function (d) {

  var staff = d.staff.map(function (u) { return [u.id, u.name]; });
  return '<div class="card" style="max-width:760px"><h1>Новый отзыв</h1><form data-act="createFeedback"><div class="grid two">' +
    '<div class="field"><label>Дата</label><input type="date" name="date" value="' + d.today + '"></div>' +
    '<div class="field"><label>Ученик</label>' + select('studentId', d.students.map(function (s) { return [s.id, s.label]; }), d.student, '— не про конкретного ученика —') +
    '<label style="margin-top:4px"><input type="checkbox" name="anonymous"> анонимно</label></div>' +
    '<div class="field"><label>От кого</label>' + select('fromType', o(d.from), 'Ученик') + '</div>' +
    '<div class="field"><label>Если от сотрудника — от какого</label>' + select('fromStaffId', staff, '', '—') + '</div>' +
    '<div class="field"><label>Канал</label>' + select('channel', o(d.channels), 'Личное сообщение') + '</div>' +
    '<div class="field"><label>О чём / о ком отзыв</label>' + select('about', o(d.about), d.about[0]) + '</div>' +
    '<div class="field"><label>Какой сотрудник (если про сотрудника)</label>' + select('aboutStaffId', staff, '', '—') + '</div>' +
    '<div class="field"><label>Тон</label>' + select('tone', [['POSITIVE', 'Позитив'], ['NEUTRAL', 'Нейтрально'], ['NEGATIVE', 'Негатив']], 'POSITIVE') + '</div>' +
    '<div class="field"><label>Риск ухода (обязательно при негативе)</label>' + select('churnRisk', [['yes', 'Да, риск'], ['no', 'Нет']], '', '—') + '</div>' +
    '<div class="field"><label>Срок проверки (для негатива)</label><input type="date" name="checkDate" value="' + d.check + '"></div></div>' +
    '<div class="field"><label>Отзыв дословно / как отреагировал</label><textarea name="text" required></textarea></div>' +
    '<div class="field"><label>Что сделано</label><textarea name="action"></textarea></div>' +
    '<div class="field"><label>Ссылка на скрин</label><input name="link" placeholder="https://…"></div><button type="submit">Сохранить отзыв</button></form></div>';
};

PAGES.feedback = function (d) {
  var tone = function (t) { return pill(TONE[t][0], TONE[t][1]); };
  var h = '<div class="row"><h1>Отзывы</h1><span style="margin-left:auto">' + L('feedback-new', '+ Отзыв', 'btn') + '</span></div><div class="tabs">' +
    L('feedback', 'Все отзывы', d.view === 'list' ? 'active' : '') + L('feedback?view=summary', 'Сводка', d.view === 'summary' ? 'active' : '') +
    L('feedback?view=control', 'Контроль (' + d.control.length + ')', d.view === 'control' ? 'active' : '') + '</div>';
  if (d.view === 'list') {
    h += '<div class="card" style="padding:0">' + table(['Дата', 'Группа', 'Ученик', 'От кого', 'Канал', 'О чём', 'Тон', 'Риск', 'Отзыв', 'Статус'], d.items.map(function (f) {
      return '<tr><td>' + f.date + '</td><td>' + e(f.group) + '</td><td>' + (f.studentId ? L('student/' + f.studentId, e(f.student)) : e(f.student)) + '</td><td>' + e(f.from) + '</td><td>' + e(f.channel) +
        '</td><td>' + e(f.about) + '</td><td>' + tone(f.tone) + '</td><td>' + (f.risk === true ? pill('да', 'red') : f.risk === false ? 'нет' : '') + '</td><td class="small" style="min-width:220px">«' + e(f.text) + '»' +
        (f.link ? ' <a href="' + e(f.link) + '" target="_blank" rel="noreferrer">скрин</a>' : '') + '</td><td>' + FBST[f.status] + '</td></tr>';
    }), 'Отзывов пока нет.') + '</div>';
  }
  if (d.view === 'summary') {
    var a = d.summary;
    var kp = function (label, v, red) { return '<div class="card' + (red ? ' redzone' : '') + '"><div class="small muted">' + label + '</div><div class="stat">' + v + '</div></div>'; };
    h += '<div class="kpis" style="margin-bottom:14px">' + kp('Всего', a.total) + kp('Позитив', a.pos) + kp('Нейтрально', a.neu) + kp('Негатив', a.neg) +
      kp('% негатива (красное &gt; 15%)', a.negPct + '%', a.negPct > 15) + kp('Риск ухода / открыто', a.risk + ' / ' + a.open) + '</div>';
    var tbl = function (title, rows) {
      return cardH(title, table(['', 'Всего', 'Позитив', 'Негатив', '% негатива', 'Риск ухода', 'Открыто'], rows.map(function (r) {
        return '<tr><td>' + e(r.key) + '</td><td>' + r.total + '</td><td>' + r.pos + '</td><td>' + r.neg + '</td><td>' + (r.negPct > 15 ? pill(r.negPct + '%', 'red') : r.negPct + '%') + '</td><td>' + r.risk + '</td><td>' + r.open + '</td></tr>';
      })));
    };
    h += tbl('По темам', d.byAbout) + tbl('По группам', d.byGroup);
  }
  if (d.view === 'control') {
    h += '<div class="card"><p class="muted small">На контроле: негатив и риск ухода со статусом «Открыт» / «В работе». Красный срок — проверка просрочена.</p>' +
      (d.control.length ? d.control.map(function (f) {
        return '<div class="item"><div class="row">' + tone(f.tone) + (f.risk ? pill('риск ухода', 'red') : '') + ' <b>' + e(f.student) + '</b> <span class="small muted">' + e(f.group) + ' · ' + e(f.about) + ' · ' + f.date + ' · открыто ' + f.daysOpen + ' дн.</span>' +
          (f.check ? pill('проверка ' + f.check, f.overdue ? 'red' : '') : '') + '</div><div>«' + e(f.text) + '»</div>' +
          '<form data-act="updateFeedback" class="grid three" style="margin-top:8px">' + hidden('feedbackId', f.id) +
          '<div class="field"><label>Что сделано</label><input name="action" value="' + e(f.action) + '"></div>' +
          (d.canDecide ? '<div class="field"><label>Решение руководителя</label><input name="decision" value="' + e(f.decision) + '"></div>' : '') +
          '<div class="field"><label>Статус</label>' + select('status', Object.keys(FBST).map(function (k) { return [k, FBST[k]]; }), f.status) + '</div>' +
          '<div class="field"><label>Срок проверки</label><input type="date" name="checkDate" value="' + f.checkIso + '"></div>' +
          '<div class="field" style="align-self:end"><button class="small" type="submit">Сохранить</button></div></form></div>';
      }).join('') : '<p>Открытых проблем нет.</p>') + '</div>';
  }
  return h;
};

PAGES.movements = function (d) {
  var MT = { TRANSFER: ['перевод', 'amber'], LEAVE: ['уход', 'red'], CHANGE: ['изменение', ''], OTHER: ['другое', ''] };
  var flag = function (n, v) { return select(n, [['yes', 'отток'], ['no', 'не отток']], v === true ? 'yes' : v === false ? 'no' : '', 'не проверено'); };
  var show = function (v) { return v === true ? pill('отток', 'red') : v === false ? pill('не отток', 'green') : pill('не проверено', 'amber'); };
  var h = '<h1>Движения учеников: уходы и переводы</h1><p class="muted small">Отметку «отток / не отток» отдельно для куратора, преподавателей и бизнеса ставит руководство с полным доступом — от неё зависит удержание сотрудников. Непроверенный уход считается оттоком.</p>';
  if (!d.items.length) h += '<div class="card muted">Движений пока нет.</div>';
  d.items.forEach(function (m) {
    h += '<div class="card"><div class="row">' + pill(MT[m.type][0], MT[m.type][1]) + ' ' + L('student/' + m.studentId, '<b>' + e(m.student) + '</b>') + ' <span class="muted small">' + m.date + ' · ' + e(m.from) +
      (m.to ? ' → ' + e(m.to) : '') + ' · мес. ' + m.month + ' · зафиксировал(а) ' + e(m.by) + '</span></div><p style="margin:6px 0"><b>' + e(m.reason || '—') + '</b>' + (m.verbatim ? ' · «' + e(m.verbatim) + '»' : '') +
      (m.action ? '<br><span class="small">Что сделал куратор: ' + e(m.action) + '</span>' : '') + (m.links ? '<br><a class="small" href="' + e(m.links) + '" target="_blank" rel="noreferrer">скриншоты / фото</a>' : '') + '</p>';
    if (m.type === 'LEAVE' || m.type === 'TRANSFER') {
      h += d.isFull ? '<form data-act="reviewMovement" class="row">' + hidden('movementId', m.id) + '<span class="small">Куратор:</span>' + flag('churnCurator', m.churnCurator) +
        '<span class="small">Химия:</span>' + flag('churnChem', m.churnChem) + '<span class="small">Биология:</span>' + flag('churnBio', m.churnBio) +
        '<span class="small">Бизнес:</span>' + flag('churnBusiness', m.churnBusiness) + '<button class="small" type="submit">Сохранить</button>' + (m.reviewed ? '<span class="small muted">проверено ' + m.reviewed + '</span>' : '') + '</form>'
        : '<div class="row small">Куратор ' + show(m.churnCurator) + ' Химия ' + show(m.churnChem) + ' Биология ' + show(m.churnBio) + ' Бизнес ' + show(m.churnBusiness) + '</div>';
    }
    h += '</div>';
  });
  return h;
};

PAGES.staff = function (d) {
  var lbl = function (inner) { return '<label style="display:inline-flex;gap:4px;align-items:center;color:inherit;font-size:12px;margin-right:8px">' + inner + '</label>'; };
  var h = '<h1>Сотрудники и доступы</h1><p class="muted small">Руководитель отдела добавляет сотрудников своего отдела и включает им разделы. Полный доступ видит всех и назначает руководителей. Код показывается один раз — передайте его сотруднику лично.</p>';
  h += cardH('Добавить сотрудника', '<form data-act="createStaff"><div class="grid three"><div class="field"><label>Имя</label><input name="name" required></div>' +
    '<div class="field"><label>Логин (латиница)</label><input name="login" required autocapitalize="none" placeholder="aisha.k"></div><div class="field"><label>Код (пусто — сгенерировать)</label><input name="code"></div>' +
    '<div class="field"><label>Отдел</label>' + select('department', d.depts.map(function (x) { return [x.code, x.label]; }), d.depts[d.depts.length > 1 ? 1 : 0].code) + '</div>' +
    (d.isFull ? '<div class="field">' + lbl('<input type="checkbox" name="isHead"> Руководитель отдела') + '<br>' + lbl('<input type="checkbox" name="isFull"> Полный доступ') + '</div>' : '') +
    '</div><button type="submit">Создать</button></form>');
  d.depts.forEach(function (dep) {
    if (!dep.users.length) return;
    h += cardH(e(dep.label) + ' (' + dep.users.length + ')', dep.users.map(function (u) {
      var me = u.id === d.meId;
      return '<div class="item"><form data-act="updateStaff">' + hidden('userId', u.id) + '<div class="row"><input name="name" value="' + e(u.name) + '" style="width:180px"><span class="muted small">логин: ' + e(u.login) + '</span>' +
        (u.isFull ? pill('полный доступ', 'blue') : '') + (u.isHead ? pill('руководитель', 'green') : '') + (!u.active ? pill('отключён', 'red') : '') + '</div>' +
        (!u.isFull && dep.grantable.length ? '<div class="row small" style="margin-top:6px">' + dep.grantable.map(function (p) {
          return lbl('<input type="checkbox" name="perm" value="' + p.key + '"' + (u.permissions.indexOf(p.key) >= 0 ? ' checked' : '') + '> ' + e(p.label));
        }).join('') + '</div>' : '') +
        '<div class="row small" style="margin-top:6px">' + (me ? hidden('active', 'on') : lbl('<input type="checkbox" name="active"' + (u.active ? ' checked' : '') + '> активен')) +
        (d.isFull ? lbl('<input type="checkbox" name="isHead"' + (u.isHead ? ' checked' : '') + '> руководитель отдела') +
          (me ? hidden('isFull', 'on') : lbl('<input type="checkbox" name="isFull"' + (u.isFull ? ' checked' : '') + '> полный доступ')) : '') +
        '<button class="small secondary" type="submit">Сохранить</button></div></form>' +
        (!me ? '<form data-act="resetCode" data-confirm="Выдать новый код? Старый перестанет работать.">' + hidden('userId', u.id) + '<button class="small secondary" type="submit" style="margin-top:6px">Выдать новый код</button></form>' : '') + '</div>';
    }).join(''));
  });
  return h;
};

PAGES.reports = function (d) {
  var P = function (x) { return x.p == null ? '<span class="muted">—</span>' : '<div style="min-width:90px">' + pctBlock('', x.p, x.num, x.den) + '</div>'; };
  var gl = function (gs) { return '<td class="small">' + gs.map(function (g) { return '<div>' + L('group/' + g.id, e(g.name)) + '</div>'; }).join('') + '</td>'; };
  var h = '<h1>Отчёты и эффективность</h1><div class="row" style="margin-bottom:12px"><span class="small muted">Период для посещаемости, тестов и ДЗ:</span>' +
    L('reports?period=7', 'неделя', 'btn small ' + (d.period === 7 ? '' : 'secondary')) + L('reports?period=28', 'месяц (28 дней)', 'btn small ' + (d.period === 28 ? '' : 'secondary')) +
    L('reports', 'весь курс', 'btn small ' + (!d.period ? '' : 'secondary')) + '<span class="small muted">Удержание — на текущий месяц курса каждой группы.</span></div>';
  if (d.showTeachers && d.teachers.length) {
    h += cardH('Преподаватели', '<p class="small muted">Оцениваются по посещаемости своих учеников, эффективности (быстрые тесты, офлайн), удержанию и опроснику.</p>' +
      table(['Преподаватель', 'Группы', 'Посещаемость', 'Эффективность', 'Удержание', 'Опросник'], d.teachers.map(function (t) {
        return '<tr><td><b>' + e(t.name) + '</b></td>' + gl(t.groups) + '<td>' + P(t.att) + '</td><td>' + P(t.eff) + '</td><td>' + P(t.ret) + '</td><td>' + P(t.survey) + '</td></tr>';
      })));
  }
  if (d.showCurators && d.curators.length) {
    h += cardH('Кураторы', '<p class="small muted">Оцениваются по выполнению ДЗ (опыты и тесты), удержанию и касаниям (цель 100%).</p>' +
      table(['Куратор', 'Группы', 'ДЗ опыты', 'ДЗ тесты', 'ДЗ всего', 'Удержание', 'Касания', 'Опросник'], d.curators.map(function (c) {
        return '<tr><td><b>' + e(c.name) + '</b></td>' + gl(c.groups) + '<td>' + P(c.exp) + '</td><td>' + P(c.test) + '</td><td>' + P(c.total) + '</td><td>' + P(c.ret) + '</td><td>' + P(c.touch) + '</td><td>' + P(c.survey) + '</td></tr>';
      })));
  }
  if (d.business) {
    h += cardH('Бизнес: удержание по группам', '<p class="small muted">База — ученики на старте курса; пришедшие позже считаются со следующего месяца. Переводы внутри UMED — не отток для бизнеса.</p>' +
      table(['Группа', 'Филиал', 'Куратор', 'Старт', 'Пришло', 'Ушло', 'Сейчас', '1 мес', '2 мес', '3 мес', '4 мес', '5 мес'], d.business.map(function (g) {
        return '<tr><td>' + L('group/' + g.id, e(g.name)) + '</td><td>' + e(g.branch) + '</td><td>' + e(g.curator || '—') + '</td><td>' + (g.start == null ? '—' : g.start) + '</td><td>' + g.joined + '</td><td>' + g.left +
          '</td><td>' + g.now + '</td>' + g.months.map(function (m) { return '<td>' + (m ? P(m) : '') + '</td>'; }).join('') + '</tr>';
      }), 'Активных групп пока нет.'));
  }
  return h;
};

PAGES.me = function (d) {
  return '<div class="card" style="max-width:420px"><h1>Мой код входа</h1><p class="muted">Логин: <b>' + e(d.user.login) + '</b></p>' +
    '<form data-act="changeOwnCode"><div class="field"><label>Текущий код</label><input type="password" name="oldCode" required></div>' +
    '<div class="field"><label>Новый код</label><input type="password" name="newCode" required minlength="4"></div><button type="submit">Сменить код</button></form></div>';
};

try {
